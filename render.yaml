# Render Blueprint — deploy 1 click: Nut "New → Blueprint" roi chon repo,
# hoac mo: https://render.com/deploy?repo=<URL-GitHub-cua-ban>
# Blueprint tu tao: API (free) + Postgres (free) + JWT secret ngau nhien.
# Luu y: Postgres free cua Render het han sau 90 ngay — dung lau dai thi
# thay DATABASE_URL bang Neon/Supabase (xem docs/DEPLOY.md).
services:
  - type: web
    name: shopfun-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    # Free tier khong ho tro preDeployCommand -> sau khi deploy xong,
    # chay migrate 1 lan bang Render Shell (xem docs/DEPLOY.md buoc 2b)
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SAMESITE
        value: none
      - key: FRONTEND_URL
        sync: false # <-- dien domain Vercel, VD: https://shopfun.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shopfun-db
          property: connectionString
      - key: VIETQR_BANK
        sync: false
      - key: VIETQR_ACCOUNT
        sync: false
      - key: VIETQR_NAME
        value: SHOPFUN

databases:
  - name: shopfun-db
    databaseName: shopfun
    user: shopfun
    plan: free
